<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Numon Gridiron</title>
<meta name="theme-color" content="#0e1533">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gridiron">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="firebase-config.js?v=202611052255"></script>
<script type="module" src="cloud.js?v=202611052255"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}button{-webkit-tap-highlight-color:transparent}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: a night stadium fills the screen; a broadcast-style scoreboard sits over a scrolling side-view field, with the play-call / question panel below. */
:root{
  --ink:#16203f; --ink-2:#4b5578; --paper:#ffffff; --paper-2:#edf1f9; --line:#d3daec;
  --accent:#ff6a1f; --navy:#16214a; --gold:#ffc93c; --turf:#3c9a40; --good:#1f9d55; --bad:#e0413a; --blue:#2f6fe0;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:#0e1533;color:var(--ink);font-family:var(--body);font-size:16px;overflow-x:hidden}
#sky{position:fixed;inset:0;z-index:0}
#app{position:relative;z-index:1;max-width:1000px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border-radius:18px;padding:8px 12px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.brand b{font-family:var(--display);font-size:22px;line-height:1;color:var(--accent);font-weight:400}
.brand span{display:block;font-size:12px;font-weight:800;color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase;line-height:1}
.stat{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;background:var(--paper-2);border-radius:999px;padding:4px 10px}
.iconbtn{width:34px;height:34px;border-radius:50%;background:var(--paper-2);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.sync{width:28px;height:28px;display:grid;place-items:center;color:#9aa6bd}
.sync.synced{color:var(--good)}.sync.error,.sync.full{color:var(--bad)}.sync.connecting{color:#c3cbe0}
.panel{background:var(--paper);border-radius:22px;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.btn{font-family:var(--display);font-size:20px;letter-spacing:.02em;padding:12px 22px;border-radius:16px;background:var(--paper-2);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.go{background:var(--accent);color:#fff;box-shadow:0 5px 0 #b2410c;font-size:26px;padding:14px 30px}
.btn.blue{background:var(--navy);color:#fff;box-shadow:0 4px 0 #050a22}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.note{font-size:15px;color:var(--ink-2);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h2{font-size:28px}
.num{font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink-2);font-size:14px}
.flipx svg{transform:scaleX(-1)}

/* home */
.hero h2.title{font-size:clamp(30px,6vw,46px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.4)}
.hero .sub{color:#dfe6ff;font-weight:700;text-shadow:0 2px 4px #070b22,0 0 10px #070b22}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.vs .art{width:min(100%,190px);aspect-ratio:1}
.vs h3{font-size:22px}
.vsmark{font-family:var(--display);font-size:42px;color:var(--accent);-webkit-text-stroke:2px var(--ink)}
.cta{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:8px;text-align:center}
.tpill{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;padding:3px 10px;border-radius:999px;color:#fff;background:var(--tp);box-shadow:inset 0 -3px 0 var(--ts)}
.sched{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.game{position:relative;border-radius:16px;padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;background:linear-gradient(160deg,var(--tp) 0 48%,var(--paper-2) 48%);border:3px solid transparent}
.game .art{width:78px;height:78px}
.game b{font-size:15px;line-height:1.1}
.game small{font-size:12px;font-weight:800;color:var(--ink-2)}
.game .wk{position:absolute;top:6px;left:8px;font-family:var(--display);font-size:13px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.game.next{border-color:var(--accent);animation:glow 1.4s ease-in-out infinite alternate}
.game.locked{cursor:not-allowed;filter:grayscale(.85);opacity:.6}
.game .done{position:absolute;top:6px;right:8px;background:var(--good);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:0 7px}
@keyframes glow{to{box-shadow:0 0 0 6px rgba(255,106,31,.3)}}

/* scoreboard */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;background:#0b1029;border-radius:18px;overflow:hidden;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.4)}
.sb-team{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--tp);min-width:0}
.sb-team.away{justify-content:flex-end;text-align:right}
.sb-team b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-team small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.85;text-transform:uppercase}
.sb-team .pts{font-family:var(--display);font-size:32px;line-height:1;background:rgba(0,0,0,.35);border-radius:10px;padding:2px 10px;font-variant-numeric:tabular-nums}
.sb-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 14px;gap:2px;text-align:center}
.dd{font-family:var(--display);font-size:22px;color:var(--gold);line-height:1;white-space:nowrap}
.spot{font-size:12px;font-weight:800;letter-spacing:.06em;color:#c9d3f5;white-space:nowrap}
.meters{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;color:#fff;font-weight:800;font-size:13px;background:rgba(11,16,41,.88);border-radius:14px;padding:5px 10px 5px 5px}
.meters .exitb{font-size:15px;padding:5px 12px;margin-right:auto;box-shadow:none}
.qcol{min-width:0;display:flex;flex-wrap:wrap;align-items:center;column-gap:18px}
.qcol>.qhead,.qcol>.msg,.qcol>.qtext,.qcol>#rev{flex-basis:100%}
.qcol>.choices{flex:1 1 240px;min-width:0}
#app:has(#v-game:not([hidden])){gap:10px;padding-bottom:10px}
.qcol>.qvis{margin-bottom:0}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.pips i{width:16px;height:8px;border-radius:3px;background:rgba(255,255,255,.2)}
.pips i.on{background:var(--gold)}.pips i.g4.on{background:var(--accent)}
.streak{display:inline-flex;gap:2px;margin-left:4px;vertical-align:middle}
.streak i{width:10px;height:14px;border-radius:50% 50% 40% 40%;background:rgba(255,255,255,.18)}
.streak i.on{background:linear-gradient(#ffd23f,#ff6a1f)}

/* field */
.stage{position:relative;height:clamp(170px,27vh,260px);border-radius:22px;overflow:hidden;background:#3c9a40}
.stage::before{display:none}
.world{position:absolute;left:0;bottom:0;height:100%;transition:transform 1.1s cubic-bezier(.3,.7,.3,1);will-change:transform}
.turf{position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.8) 0 2px,transparent 2px calc(var(--ypx)*5)) calc(var(--ypx)*10) 0/calc(var(--ypx)*100) 100% no-repeat,
  repeating-linear-gradient(90deg,#3c9a40 0 calc(var(--ypx)*5),#45a849 calc(var(--ypx)*5) calc(var(--ypx)*10));
  box-shadow:inset 0 6px 0 rgba(255,255,255,.7),inset 0 -6px 0 rgba(255,255,255,.7)}
.hash{position:absolute;left:calc(var(--ypx)*10);width:calc(var(--ypx)*100);height:6px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.7) 0 2px,transparent 2px var(--ypx))}
.ez{position:absolute;top:0;bottom:0;width:calc(var(--ypx)*10);display:grid;place-items:center;overflow:hidden;background:var(--tp);border-inline:3px solid #fff}
.ez span{font-family:var(--display);color:var(--ts);font-size:calc(var(--ypx)*2.6);transform:rotate(-90deg);white-space:nowrap;letter-spacing:.06em;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.ez.away span{transform:rotate(90deg)}
.yn{position:absolute;transform:translateX(-50%);font-family:var(--display);color:rgba(255,255,255,.85);font-size:calc(var(--ypx)*1.7);line-height:1}
.ln{position:absolute;top:0;bottom:0;width:4px;transform:translateX(-50%);transition:left 1.1s cubic-bezier(.3,.7,.3,1)}
.ln.los{background:#3d8bff;box-shadow:0 0 8px #3d8bff}
.ln.fd{background:#ffe14a;box-shadow:0 0 8px #ffe14a}
.spr{position:absolute;width:var(--spr,90px);aspect-ratio:1;transform:translateX(-50%);transition:left 1.1s cubic-bezier(.3,.7,.3,1);z-index:2}
.spr.back{z-index:1;width:var(--sprb,76px)}
.spr .inner{width:100%;height:100%}
.spr svg{width:100%;height:100%}
.run .inner{animation:runbob .18s ease-in-out infinite alternate}
@keyframes runbob{to{transform:translateY(-8%) rotate(-4deg)}}
.leap .inner{animation:leap 1.1s ease-in-out}
@keyframes leap{50%{transform:translateY(-75%) rotate(-12deg)}}
.hit .inner{animation:hit .5s ease}
@keyframes hit{20%{transform:translateX(-8%) rotate(8deg);filter:brightness(1.8)}50%{transform:translateX(6%) rotate(-6deg)}}
.dance .inner{animation:dance .45s ease-in-out infinite alternate}
@keyframes dance{from{transform:translateY(0) rotate(-10deg)}to{transform:translateY(-18%) rotate(10deg)}}
.idle .inner{animation:idle 2.2s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-4%)}}
.fb{background:radial-gradient(ellipse at 40% 35%,#c27a3a,#7a3d14 70%);border-radius:50%;border:2px solid #4a2208;position:relative}
.fb::after{content:"";position:absolute;left:30%;right:30%;top:45%;height:2px;background:#fff;box-shadow:0 -3px 0 -1px transparent}
.flyball{position:absolute;width:26px;height:16px;z-index:4}
.flash{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(30px,7vw,60px);color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--ink);white-space:nowrap;z-index:5;pointer-events:none;opacity:0}
.flash.show{animation:flash 1.5s ease forwards}
.flash.gold{color:var(--gold)}.flash.red{color:#ff8a7a}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}

/* play call + question */
.calls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.play{border-radius:20px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.3);position:relative;overflow:hidden}
.play::after{content:"";position:absolute;right:-20px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1)}
.play b{font-family:var(--display);font-weight:400;font-size:36px;line-height:1;letter-spacing:.04em}
.play span{font-weight:700;font-size:15px;opacity:.95}
.play em{font-style:normal;font-family:var(--display);font-size:20px;color:var(--gold)}
.play.run{background:linear-gradient(135deg,#2f8f3a,#1b6b26)}
.play.pass{background:linear-gradient(135deg,#2f6fe0,#1b3f9e)}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.qpanel{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,1.15fr) auto;gap:16px;align-items:start}
.scratch{display:flex;flex-direction:column;gap:6px;min-width:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sc-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sc-head .eyebrow{margin-right:auto}
.scwrap{position:relative}
.scgrow{position:absolute;left:8px;bottom:8px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--display);font-size:28px;line-height:1;display:grid;place-items:center;box-shadow:0 3px 0 #1b3f9e;z-index:2}
.scgrow:active{transform:translateY(2px);box-shadow:0 1px 0 #1b3f9e}
.scratch.big canvas{height:clamp(380px,62vh,680px)!important}
.sc-tools{display:flex;gap:5px;flex-wrap:wrap}
.sc-tools button{height:34px;min-width:34px;padding:0 10px;border-radius:10px;background:var(--paper-2);font-weight:800;font-size:13px;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:4px;border:2px solid transparent}
.sc-tools button.on{border-color:var(--accent);background:#fff1e8}
.sc-tools .sw{width:18px;height:18px;border-radius:50%;display:block;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.scratch canvas{display:block;width:100%;height:clamp(180px,30vh,300px);border-radius:14px;border:2px solid var(--line);touch-action:none;cursor:crosshair;
  background-color:#fffef8;background-image:linear-gradient(#e3e9f5 1px,transparent 1px),linear-gradient(90deg,#e3e9f5 1px,transparent 1px);background-size:24px 24px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;padding:3px 10px;border-radius:999px;color:#fff;background:var(--navy)}
.chip.run{background:#2f8f3a}.chip.pass{background:#2f6fe0}.chip.worth{background:var(--accent)}.chip.lvl{background:#5b3fb8}
.msg{font-weight:700;color:var(--ink-2);min-height:1.5em;font-size:15px;margin-top:6px}
.qtext{font-size:clamp(22px,4.6vw,32px);font-weight:800;line-height:1.2;margin:4px 0 8px;text-wrap:balance}
.qvis{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.qvis svg{max-width:100%}
.ansbox{display:inline-flex;align-items:baseline;gap:4px;min-width:150px;justify-content:center;font-family:var(--display);font-size:40px;line-height:1;padding:10px 18px;border-radius:16px;border:3px dashed var(--line);font-variant-numeric:tabular-nums}
.ansbox.ok{border:3px solid var(--good);background:#e6f7ec}.ansbox.bad{border:3px solid var(--bad);background:#fdeaea}
.ansbox .ph{color:#b7bfd6}.ansbox small{font-size:22px}
.reveal{font-weight:800;color:var(--bad);font-size:18px;margin-top:6px}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.pad button{height:56px;border-radius:14px;background:var(--paper-2);font-family:var(--display);font-size:26px;box-shadow:0 4px 0 var(--line)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .enter{background:var(--good);color:#fff;box-shadow:0 4px 0 #136b39}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.choices button{min-height:64px;padding:8px 12px;border-radius:16px;background:var(--paper-2);font-family:var(--display);font-size:28px;box-shadow:0 4px 0 var(--line);display:flex;align-items:center;justify-content:center;gap:4px}
.choices button.ok{background:var(--good);color:#fff;box-shadow:0 4px 0 #136b39}
.choices button.bad{background:var(--bad);color:#fff;box-shadow:0 4px 0 #9c2420}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle;margin:0 .1em;font-variant-numeric:tabular-nums}
.frac span:first-child{border-bottom:.08em solid currentColor;padding:0 .15em .05em}
.frac span:last-child{padding-top:.05em}

/* sports cards */
.cwrap{container-type:inline-size;width:100%}
.scard{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;position:relative;display:block;aspect-ratio:5/7;width:100%;border-radius:4cqw;padding:3.6cqw;background:var(--frame);overflow:hidden;color:var(--ink);text-align:left;
  box-shadow:0 2cqw 4cqw rgba(0,0,0,.45),inset 0 0 0 .5cqw rgba(255,255,255,.5);transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .35s ease}
.scard.live{transition:none}
.t-base{--frame:linear-gradient(145deg,#ffffff,#e3e7ef)}
.t-silver{--frame:linear-gradient(145deg,#f7f9fc,#aab4c4 35%,#ffffff 52%,#8f9bb0 75%,#e6eaf1)}
.t-gold{--frame:linear-gradient(145deg,#fff4c0,#d39b0b 28%,#fff7d0 48%,#a87300 70%,#ffe38a)}
.t-hof{--frame:linear-gradient(135deg,#ff7a7a,#ffd76b 20%,#7dffb8 40%,#6cc8ff 60%,#b47bff 80%,#ff7a7a)}
.sface{position:relative;height:100%;display:flex;flex-direction:column;border-radius:2cqw;overflow:hidden;background:var(--tp)}
.sphoto{position:relative;flex:1;overflow:hidden;background:
  radial-gradient(circle at 20% 8%,rgba(255,255,255,.55),transparent 18%),radial-gradient(circle at 80% 6%,rgba(255,255,255,.45),transparent 16%),
  repeating-linear-gradient(-35deg,rgba(255,255,255,.07) 0 6cqw,transparent 6cqw 12cqw),
  linear-gradient(170deg,color-mix(in srgb,var(--tp) 70%,#fff) 0%,var(--tp) 55%,color-mix(in srgb,var(--tp) 60%,#000) 100%)}
.sphoto .bignum{position:absolute;right:-3cqw;top:-4cqw;font-family:var(--display);font-size:46cqw;line-height:1;color:var(--ts);opacity:.22}
.sphoto .mon{position:absolute;left:50%;bottom:-3%;height:96%;aspect-ratio:1;transform:translateX(-50%);filter:drop-shadow(0 2cqw 1.6cqw rgba(0,0,0,.35))}
.sphoto .mon svg{width:100%;height:100%}
.sbadge{position:absolute;left:4cqw;top:4cqw;width:16cqw;height:16cqw;border-radius:50%;display:grid;place-items:center;background:var(--ts);color:var(--tp);font-family:var(--display);font-size:7cqw;box-shadow:0 0 0 1cqw var(--tp),0 0 0 1.6cqw var(--ts)}
.sban{position:relative;padding:3.4cqw 4cqw 3cqw;background:#fff;color:var(--ti);clip-path:polygon(0 18%,100% 0,100% 100%,0 100%);margin-top:-6cqw;display:flex;flex-direction:column;gap:.6cqw}
.sban::before{content:"";position:absolute;left:0;right:0;top:0;height:3cqw;background:var(--ts);clip-path:polygon(0 100%,100% 0,100% 40%,0 100%)}
.sname{font-family:var(--display);font-size:11cqw;line-height:1;color:var(--ti);display:flex;align-items:center;gap:2cqw}
.spos{font-family:var(--body);font-weight:800;font-size:4.6cqw;color:var(--ts);background:var(--tp);border-radius:1.4cqw;padding:.4cqw 1.8cqw;letter-spacing:.06em}
.steam{font-weight:800;font-size:4.8cqw;letter-spacing:.08em;text-transform:uppercase;color:var(--ti);opacity:.85;line-height:1.1}
.stier{display:flex;justify-content:space-between;font-weight:800;font-size:3.6cqw;letter-spacing:.1em;text-transform:uppercase;padding:1.4cqw 3cqw;background:rgba(0,0,0,.25);color:#fff}
.perfect{position:absolute;left:4cqw;bottom:4cqw;background:var(--gold);color:var(--ink);font-weight:800;font-size:4.2cqw;padding:.6cqw 2.4cqw;border-radius:2cqw;box-shadow:0 .6cqw 0 rgba(0,0,0,.3);transform:rotate(-6deg)}
.copies{position:absolute;right:5cqw;top:5cqw;z-index:3;background:linear-gradient(#ff7a5c,#e0412a);color:#fff;font-family:var(--display);font-size:6cqw;line-height:1;padding:1cqw 2.4cqw;border-radius:3cqw;box-shadow:0 0 0 .5cqw #fff}
.foil{position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:inherit}
.t-gold .sphoto .foil,.t-hof .foil{opacity:.2;mix-blend-mode:soft-light;background:repeating-linear-gradient(115deg,#ff7a7a 0%,#ffd76b 7%,#7dffb8 14%,#6cc8ff 21%,#b47bff 28%,#ff7a7a 35%);background-size:400% 400%;background-position:var(--mx) var(--my)}
.t-silver .sphoto .foil{opacity:.35;mix-blend-mode:overlay;background:linear-gradient(115deg,transparent 30%,#fff 50%,transparent 70%) 0 0/300% 100%;background-position:var(--mx) 0}
.scard:not(.live) .foil{animation:foil 7s linear infinite}
@keyframes foil{from{background-position:0% 50%}to{background-position:100% 50%}}
.scard>.foil{z-index:3;opacity:.2!important}
.sparkle{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle,#fff 0 .3cqw,transparent .55cqw) 0 0/7cqw 9cqw,radial-gradient(circle,#fff6c2 0 .25cqw,transparent .5cqw) 3.5cqw 4.5cqw/7cqw 9cqw;animation:twinkle 2.4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.15}to{opacity:.85}}
.glare{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .3s;mix-blend-mode:overlay;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.85),rgba(255,255,255,0) 50%)}
.scard.live .glare{opacity:1}
.sback{aspect-ratio:5/7;border-radius:4cqw;padding:3.6cqw;background:var(--frame);box-shadow:0 2cqw 4cqw rgba(0,0,0,.45)}
.sback .bk{height:100%;border-radius:2cqw;background:#f4f1e8;display:flex;flex-direction:column;gap:1.8cqw;padding:3.6cqw;color:var(--ink);font-size:3.9cqw;line-height:1.3;overflow:hidden}
.sback .bkh{display:flex;align-items:center;gap:3cqw;border-bottom:.8cqw solid var(--tp);padding-bottom:2cqw}
.sback .bkh b{font-family:var(--display);font-weight:400;font-size:9cqw;line-height:1}
.sback table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sback th{text-align:left;font-size:3.6cqw;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:1cqw 0}
.sback td{font-weight:800;padding:1cqw 0;border-bottom:.3cqw dashed #cfc8b4}
.sback .rep{background:#fff;border-radius:2cqw;padding:1.8cqw 2.6cqw;font-style:italic;font-weight:600;font-size:3.6cqw}
.sback .joke{background:#fff6cf;border:.5cqw dashed #e0b100;border-radius:2cqw;padding:1.8cqw 2.6cqw;font-weight:700;font-size:3.7cqw}
.sback .joke b,.sback .fact b{font-family:var(--display);font-weight:400;color:var(--tp);font-size:4.2cqw}
.sback .joke span{display:block;font-family:var(--display);font-weight:400;font-size:4.4cqw;color:#c0392b;margin-top:.6cqw}
.sback .fact{background:#e6efff;border-radius:2cqw;padding:1.8cqw 2.6cqw;font-weight:600;font-size:3.6cqw;border-left:1.2cqw solid var(--tp)}
.sback .rec{font-weight:800;font-size:3.4cqw;color:var(--ink-2)}
.sback .seal{margin-top:auto;display:flex;justify-content:space-between;font-weight:800;font-size:3.6cqw;color:var(--ink-2);letter-spacing:.08em;text-transform:uppercase}

/* binder */
.book{background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px) 0 0/6px 6px,linear-gradient(160deg,#3b2414,#22140b);border-radius:24px;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.45),inset 0 0 0 3px rgba(255,255,255,.08);outline:2px dashed rgba(255,201,60,.4);outline-offset:-10px}
.sheet{position:relative;border-radius:16px;padding:14px 14px 16px 38px;background:linear-gradient(180deg,#f6f8fd,#e2e8f4);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.sheet::before{content:"";position:absolute;left:9px;top:14px;bottom:14px;width:18px;background:radial-gradient(circle at 9px 9px,#22140b 5.5px,#aab4cc 6.5px,transparent 7.5px) 0 0/18px 54px repeat-y}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.slot{border-radius:12px;padding:5px;background:rgba(255,255,255,.65);box-shadow:inset 0 0 0 1px rgba(22,32,63,.12)}
.slot>button{display:block;width:100%;padding:0;border-radius:4cqw}
.empty{aspect-ratio:5/7;border-radius:8px;border:3px dashed var(--tp);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-2);font-weight:800;text-align:center;padding:8px;background:linear-gradient(180deg,transparent 60%,color-mix(in srgb,var(--tp) 15%,transparent))}
.empty .art{width:60%;aspect-ratio:1}
.empty .art svg{filter:brightness(0);opacity:.22}
.empty b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--ink-2)}
.prog{height:14px;border-radius:8px;background:var(--paper-2);overflow:hidden;flex:1;min-width:120px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent))}

/* report */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--paper-2);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.kpi b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi b small{font-size:18px;color:var(--ink-2)}
.kpi em{font-style:normal;font-size:13px;font-weight:700;color:var(--ink-2)}
.rh{font-size:22px;margin-bottom:8px}
.meters2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 22px}
.meter{display:grid;gap:3px;margin-bottom:12px}
.meter .ml{display:flex;justify-content:space-between;font-weight:800;font-size:15px}
.meter .mt{height:12px;border-radius:6px;background:var(--paper-2);overflow:hidden}
.meter .mt i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--blue)}
.meter small{font-size:12px;font-weight:700;color:var(--ink-2)}
.seg{display:inline-flex;background:var(--paper-2);border-radius:12px;padding:3px;flex-wrap:wrap}
.seg button{font-weight:800;font-size:14px;padding:6px 12px;border-radius:9px;color:var(--ink-2)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:12px}
.mi{border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--ink-2)}
.mq{font-weight:800;font-size:18px;line-height:1.25}
.mvis{display:flex;gap:8px;flex-wrap:wrap}.mvis svg{max-height:84px;width:auto;max-width:100%}
.mans{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:700}
.mans .gave{color:var(--bad)}.mans .right{color:var(--good)}.mans .tries{color:var(--ink-2)}
.mans b{font-family:var(--display);font-weight:400;font-size:18px}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:1px 9px;color:#fff}
.pill.ok{background:var(--good)}.pill.need{background:var(--accent)}.pill.lost{background:#8d97b3}
.tablewrap{overflow-x:auto}
.blog{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.blog th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:6px 8px;border-bottom:2px solid var(--line)}
.blog td{padding:7px 8px;border-bottom:1px solid var(--paper-2);font-weight:600;white-space:nowrap}
.blog .r{text-align:right}

/* promo cards */
.t-legend{--frame:linear-gradient(145deg,#f3d9a8,#8a5a2b 35%,#e8c590 55%,#6e4520 80%,#d9b37a)}
.sphoto.th-legend{background:radial-gradient(circle at 50% 40%,rgba(255,240,210,.7),transparent 60%),repeating-linear-gradient(-35deg,rgba(90,52,22,.08) 0 6cqw,transparent 6cqw 12cqw),linear-gradient(170deg,#f1dcb4,#c99b62 70%,#8a5a2b)}
.sphoto.th-legend .mon{filter:sepia(.45) drop-shadow(0 2cqw 1.6cqw rgba(60,30,10,.35))}
.sphoto.th-legend .bignum{color:#5a3416}
.sphoto.th-gold{background:repeating-conic-gradient(from 0deg at 50% 60%,rgba(255,255,255,.28) 0 8deg,transparent 8deg 16deg),radial-gradient(circle at 50% 60%,#fff6cc,#f2b705 55%,#a87300)}
.sphoto.th-gold .bignum{color:#fff}
.sphoto.th-snow{background:radial-gradient(circle,#fff 0 .7cqw,transparent 1cqw) 0 0/9cqw 9cqw,radial-gradient(circle,rgba(255,255,255,.8) 0 .5cqw,transparent .8cqw) 4cqw 5cqw/11cqw 10cqw,linear-gradient(180deg,#bfe3ff,#3d6fc0 70%,#e9f4ff 70%,#ffffff)}
.sphoto.th-fall{background:radial-gradient(ellipse 2cqw 1.2cqw,#c2571a 60%,transparent 70%) 0 0/12cqw 11cqw,radial-gradient(ellipse 1.6cqw 1cqw,#ffb03a 60%,transparent 70%) 6cqw 5cqw/13cqw 12cqw,linear-gradient(180deg,#ffe3a6,#f08a2a)}
.sphoto.th-allstar{background:radial-gradient(circle,#fff 0 .6cqw,transparent .9cqw) 0 0/8cqw 8cqw,linear-gradient(150deg,#ff5a7a,#7a3fd0 55%,#2a2a9a)}
.sphoto.th-spooky{background:radial-gradient(circle at 78% 18%,#fff6c2 0 9cqw,rgba(255,246,194,.25) 9.5cqw,transparent 16cqw),radial-gradient(circle,rgba(255,255,255,.7) 0 .35cqw,transparent .6cqw) 0 0/10cqw 9cqw,linear-gradient(180deg,#1d0f3a,#5a2a8a 70%,#ff7a1a 70%,#c2571a)}
.sphoto.th-night{background:radial-gradient(ellipse at 15% 5%,rgba(255,250,220,.6),transparent 30%),radial-gradient(ellipse at 85% 5%,rgba(255,250,220,.6),transparent 30%),radial-gradient(circle,#fff 0 .3cqw,transparent .55cqw) 0 0/7cqw 7cqw,linear-gradient(180deg,#0b1430,#2a3a7a 70%,#2f8a37 70%)}
.sphoto.th-retro{background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 4cqw,transparent 4cqw 8cqw),linear-gradient(170deg,#f6e2b8,#d9a066 70%,#9a5a2a)}
.ptag{position:absolute;left:23cqw;right:3cqw;top:5cqw;text-align:center;white-space:nowrap;font-family:var(--display);font-size:5.4cqw;letter-spacing:.04em;padding:1cqw 3.4cqw;border-radius:3cqw;color:#fff;background:#16203f;box-shadow:0 .6cqw 0 rgba(0,0,0,.3);z-index:2;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.ptag.legend{background:#5a3416;color:#ffe9c2}.ptag.award{background:linear-gradient(#ffd34a,#c88a00);color:#3a2600}.ptag.special{background:linear-gradient(90deg,#ff5a7a,#7a3fd0)}
.pull.promo{position:relative}.pull.promo .scard{box-shadow:0 0 0 4px var(--gold),0 0 30px rgba(255,201,60,.8)}
.promolabel{text-align:center;font-family:var(--display);font-size:18px;color:var(--accent);margin-bottom:4px}

/* editions */
.edstamp{position:absolute;top:0;right:0;z-index:3;font-family:var(--display);font-size:4cqw;letter-spacing:.05em;padding:.8cqw 2.6cqw;border-radius:0 0 0 3cqw;color:#fff;background:var(--edc,#555);text-shadow:0 .3cqw 0 rgba(0,0,0,.3);text-transform:uppercase}
.scard.e2,.sback.e2{--frame:linear-gradient(145deg,#f6c99b,#9c5a2c 30%,#f0b27a 52%,#6e3a17 78%,#d9965c)}.e2 .edstamp{--edc:linear-gradient(#cf8f58,#7d4520)}
.scard.e3,.sback.e3{--frame:linear-gradient(145deg,#ffffff,#9aa6b8 28%,#f4f7fb 48%,#7d899c 72%,#e7ebf2)}.e3 .edstamp{--edc:linear-gradient(#b8c2d2,#6b778a)}
.scard.e4,.sback.e4{--frame:linear-gradient(145deg,#fff3b0,#c98d00 26%,#fff6c8 46%,#a06c00 70%,#ffe07a)}.e4 .edstamp{--edc:linear-gradient(#f2c230,#a87300)}
.scard.e5,.sback.e5{--frame:linear-gradient(135deg,#ff6b6b,#ffd36b 18%,#6bffb0 36%,#6bc8ff 54%,#b06bff 72%,#ff6bd9 90%)}.e5 .edstamp{--edc:linear-gradient(90deg,#ff6b6b,#ffd36b,#6bffb0,#6bc8ff,#b06bff)}
.scard.e6,.sback.e6{--frame:linear-gradient(115deg,#ff6b6b,#ffd36b,#6bffb0,#6bc8ff,#b06bff,#ff6bd9,#ff6b6b,#ffd36b,#6bffb0);background-size:300% 300%;animation:shinyframe 4s linear infinite}
.scard.e6{box-shadow:0 0 18px rgba(255,255,255,.7),0 0 34px rgba(180,120,255,.55),0 2cqw 4cqw rgba(0,0,0,.45)}
.e6 .edstamp{--edc:linear-gradient(90deg,#7a3fd0,#ff5aa8,#ffb03a)}
@keyframes shinyframe{to{background-position:300% 0}}
.scard.e5 .sphoto .foil,.scard.e6 .sphoto .foil{opacity:.42;mix-blend-mode:color-dodge;background:repeating-linear-gradient(115deg,#ff7a7a 0%,#ffd76b 7%,#7dffb8 14%,#6cc8ff 21%,#b47bff 28%,#ff7a7a 35%);background-size:400% 400%;background-position:var(--mx) var(--my)}
.scard.e6 .sparkle{animation-duration:1.2s;opacity:1}
.scard.e4 .sparkle{opacity:.6}
.edban{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(120deg,#ffb703,#ff6a1f 50%,#c2459a);color:#fff;border-radius:20px;padding:14px 18px;box-shadow:0 6px 0 rgba(0,0,0,.35);animation:glow 1.4s ease-in-out infinite alternate}
.edban b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}.edban span{font-weight:700}
.edban.done{animation:none;background:linear-gradient(120deg,#7a3fd0,#2f6fe0)}
.edbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.edtab{font-weight:800;font-size:14px;padding:6px 12px;border-radius:999px;background:var(--paper-2);border:2px solid transparent}
.edtab.on{border-color:var(--accent);background:#fff1e8}
.tradebtn{margin-top:6px;font-weight:800;font-size:13px;padding:6px 10px;border-radius:10px;background:var(--gold);color:#3a2600;box-shadow:0 3px 0 #b07800}

.prize{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.prize svg{animation:prizebob 1.2s ease-in-out infinite alternate}
@keyframes prizebob{to{transform:translateY(-8px) rotate(4deg)}}
.prize-h{font-size:38px!important;color:var(--accent)}
.prize-go{font-family:var(--display);font-size:26px;color:#7a3fd0;margin:0}
.prize-msg{font-size:20px;font-weight:800;line-height:1.35;background:#fff6cf;border:3px dashed #f2b705;border-radius:16px;padding:12px 16px;margin:4px 0 0;max-width:460px}
/* hockey rink */
.rink{position:relative;height:clamp(170px,27vh,260px);border-radius:90px;overflow:hidden;background:linear-gradient(180deg,#f8fbff,#e2ecf8);border:5px solid #fff;box-shadow:0 0 0 3px #b9c8de,0 6px 0 rgba(0,0,0,.3)}
.rk{position:absolute;top:0;bottom:0;width:6px;transform:translateX(-50%)}
.rk.red{background:#d8243a}.rk.blue{background:#1f4fb8;width:9px}.rk.goal{background:#d8243a;width:2px}
.rk-c{position:absolute;width:15%;aspect-ratio:1;border:2.5px solid #d8243a;border-radius:50%;transform:translate(-50%,-50%)}
.rk-c.center{border-color:#1f4fb8;width:18%}
.crease{position:absolute;top:50%;width:5%;height:30%;transform:translateY(-50%);background:rgba(80,140,230,.35);border:2px solid #d8243a}
.crease.r{left:88%;border-radius:100px 0 0 100px;border-right:0}.crease.l{left:7%;border-radius:0 100px 100px 0;border-left:0}
.net{position:absolute;top:50%;width:4%;height:24%;transform:translateY(-50%);border:4px solid #d8243a;transition:box-shadow .3s;
  background:repeating-linear-gradient(45deg,rgba(0,0,0,.18) 0 2px,transparent 2px 7px),repeating-linear-gradient(-45deg,rgba(0,0,0,.18) 0 2px,transparent 2px 7px),rgba(255,255,255,.75)}
.net.r{left:93%;border-left:0;border-radius:0 10px 10px 0}.net.l{left:3%;border-right:0;border-radius:10px 0 0 10px}
.net.lit{box-shadow:0 0 30px 12px rgba(255,40,40,.75)}
.hspr{position:absolute;width:var(--hspr,110px);aspect-ratio:1;transform:translateX(-50%);transition:left .7s ease,bottom .7s ease;z-index:2}
.hspr.back{z-index:1;width:calc(var(--hspr,110px)*.85)}
.hspr .inner{width:100%;height:100%}.hspr svg{width:100%;height:100%}
.hspr.glide .inner{animation:glide .3s ease-in-out infinite alternate}
@keyframes glide{to{transform:translateY(-4%) rotate(-5deg)}}
.hspr.dive .inner{animation:hdive .6s ease}
@keyframes hdive{50%{transform:translateY(-10%) rotate(-22deg)}}
.hspr.cheer .inner{animation:dance .45s ease-in-out infinite alternate}
.puck{position:absolute;width:16px;height:9px;border-radius:50%;background:#111;box-shadow:0 2px 0 rgba(0,0,0,.25);z-index:3}
.pk-ball.puck{width:46px;height:18px;border-radius:50%;background:#111;border:2px solid #444;transform:none}
.hbook{background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px) 0 0/6px 6px,linear-gradient(160deg,#1d3a5c,#0e1f33)}

/* weather + settings */
.wxturf{position:absolute;inset:0;pointer-events:none}
.wx-snow .wxturf{background:radial-gradient(ellipse 70px 26px,rgba(255,255,255,.9),transparent 70%) 0 0/230px 90px,radial-gradient(ellipse 50px 20px,rgba(255,255,255,.85),transparent 70%) 110px 45px/260px 110px,rgba(240,246,252,.5)}
.wx-rain .wxturf{background:repeating-linear-gradient(100deg,rgba(255,255,255,.08) 0 3px,transparent 3px 46px),rgba(20,40,70,.3)}
.wx-night .wxturf{background:radial-gradient(ellipse 300px 100% at 50% 0,rgba(255,255,230,.16),transparent 70%) 0 0/600px 100%,rgba(0,0,40,.24)}
.wx-sunset .wxturf{background:linear-gradient(rgba(255,140,60,.2),rgba(120,40,90,.12))}
.wx-cloudy .wxturf{background:rgba(60,70,90,.14)}
.stage.wx-sunny::before{background:linear-gradient(rgba(150,210,255,.45),rgba(255,255,255,.08))}
.stage.wx-cloudy::before{background:linear-gradient(rgba(150,160,180,.5),rgba(80,90,110,.3))}
.stage.wx-rain::before{background:linear-gradient(rgba(40,50,70,.65),rgba(20,30,50,.5))}
.stage.wx-snow::before{background:linear-gradient(rgba(200,212,232,.55),rgba(140,155,185,.35))}
.stage.wx-sunset::before{background:linear-gradient(rgba(255,120,90,.45),rgba(110,60,140,.35))}
.wxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.acct{background:var(--paper-2);border-radius:14px;padding:10px 12px;text-align:left}
.gtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gtop .btn{font-size:17px;padding:8px 14px}
.learnbtn{height:30px;padding:0 12px;border-radius:999px;background:#fff3c4;border:2px solid #f2b705;font-weight:800;font-size:13px;color:#5a3d00}
.lesson{width:100%;text-align:left;display:flex;flex-direction:column;gap:10px}
.lesson h2{font-size:28px}
.lsec{background:var(--paper-2);border-radius:14px;padding:10px 14px}
.lsec h3{font-size:18px;margin-bottom:4px}
.lsec dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:4px 12px}
.lsec dt{font-weight:800}.lsec dd{margin:0}
.lsec ol{margin:0;padding-left:22px;display:grid;gap:3px;font-weight:600}
.lex{background:#e8f6ec;border:2px solid #b5e2c3}.lex p{margin:2px 0;font-weight:700}
.lans{margin-top:4px;font-size:18px}.lans b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--good)}
.lhook{margin:0;font-size:18px;font-weight:800;color:#7a3fd0;line-height:1.35}

.dailyban{display:flex;align-items:center;gap:14px;text-align:left;background:linear-gradient(120deg,#7a3fd0,#c2459a);color:#fff;border-radius:20px;padding:12px 16px;box-shadow:0 6px 0 rgba(0,0,0,.35);animation:glow 1.4s ease-in-out infinite alternate}
.dailyban .pack{width:64px}.dailyban .pack b,.dailyban .pack span{display:none}.dailyban .pk-top{font-size:6px;padding:2px 0}

.pack.daily{background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 48%,transparent 60%) 0 0/300% 100%,repeating-linear-gradient(-35deg,rgba(255,255,255,.1) 0 10px,transparent 10px 20px),linear-gradient(160deg,#7a3fd0,#2a145a)}
.stylepick{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 14px;border-radius:18px;background:var(--paper-2);border:3px solid transparent;width:170px}

/* shop */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin:14px 0}

.pack{width:120px;aspect-ratio:5/7;flex:none;border-radius:10px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;text-align:center;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 48%,transparent 60%) 0 0/300% 100%,repeating-linear-gradient(-35deg,rgba(255,255,255,.08) 0 10px,transparent 10px 20px),linear-gradient(160deg,#00338D,#0b1a4a);
  box-shadow:0 6px 0 rgba(0,0,0,.3),inset 0 0 0 3px rgba(255,255,255,.35);animation:sweep 3.5s ease-in-out infinite}
.pack.mega{background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 48%,transparent 60%) 0 0/300% 100%,repeating-linear-gradient(-35deg,rgba(255,255,255,.1) 0 10px,transparent 10px 20px),linear-gradient(160deg,#ffc93c,#c46a00)}
.pack b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35)}

.pulls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%}

.btn[disabled]{opacity:.5;cursor:not-allowed}

.cprev-wrap{position:sticky;top:0;background:radial-gradient(circle,#e8eefc,#c9d6f3);border-radius:18px;padding:8px}
.cprev-wrap .art{width:100%;aspect-ratio:1}

.scrim{position:fixed;inset:0;z-index:20;background:rgba(6,10,30,.7);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--paper);border-radius:24px;padding:20px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.35);animation:pop .35s ease}
.modal.wide{max-width:680px}
.modal h2{font-size:30px}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.showcase{width:min(320px,80vw);perspective:1000px}
.showcase .fi{position:relative;transform-style:preserve-3d;transition:transform .7s ease}
.showcase .fi.flipped{transform:rotateY(180deg)}
.showcase .fi>*{backface-visibility:hidden}
.showcase .fi>.cwrap.back{position:absolute;inset:0;transform:rotateY(180deg)}
.reveal-in{animation:revealIn 1s .2s ease both}
@keyframes revealIn{from{transform:rotateY(180deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;width:100%}

.mini button.sel{border-color:var(--accent)}
.mini .art{width:70px;height:70px}
.field{font:inherit;font-size:24px;font-weight:800;width:140px;text-align:center;padding:8px;border-radius:12px;border:3px solid var(--line);color:var(--ink);background:var(--paper)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .45s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(.88,1.1)}}

@media (max-height:900px){.choices button{min-height:52px;font-size:24px}.qvis svg[aria-label="Clock"]{width:124px;height:124px}.pad button{height:48px}.pad{gap:7px}.qtext{font-size:clamp(20px,3.6vw,28px);margin:2px 0 6px}.msg{margin-top:2px}#gp.panel{padding:12px 14px}}

  .qpanel{grid-template-columns:minmax(0,1fr) auto;row-gap:10px}

  .qpanel>.scratch:last-child{grid-column:1/-1}
}
@media (max-width:640px){
  .qpanel{grid-template-columns:1fr}
  .pad{grid-template-columns:repeat(3,1fr);width:100%}
}
@media (max-width:640px){
  .sb-team b{font-size:15px}.sb-team .pts{font-size:24px;padding:2px 7px}.sb-team small{display:none}
  .sb-team{padding:6px 8px;gap:6px}.sb-mid{padding:4px 6px}.dd{font-size:17px}

  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.sheet{padding:12px 10px 12px 30px}.sheet::before{left:5px}.book{padding:10px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

  multdiv(t){

    if(t===2){if(Math.random()<.65){const a=R(6,9),b=R(3,9);return numQ(`${a} × ${b} = ?`,a*b)}const d=pick([3,4]),q=R(3,10);return numQ(`${d*q} ÷ ${d} = ?`,q)}
    const r=Math.random();
    if(r<.25){const d=R(6,9),q=R(4,9);return numQ(`${d*q} ÷ ${d} = ?`,q)}
    if(r<.5){const a=R(6,9),b=R(4,9);return numQ(`${a} × ? = ${a*b}`,b)}
    if(r<.7){const a=R(3,9),b=pick([20,30,40,50,60,70,80,90]);return numQ(`${a} × ${b} = ?`,a*b)}
    if(r<.85){const a=R(6,9),b=R(4,9);return numQ(`There are ${a} nests with ${b} eggs in each nest. How many eggs in all?`,a*b)}

    if(k==='elapsedX'){let h=R(1,10),m,d;do{m=R(3,11)*5;d=R(3,9)*5}while(m+d<65);const [eh,em]=addMin(h,m,d);return choiceQ(`A battle starts at ${tm(h,m)} and lasts ${d} minutes. What time does it end?`,tm(eh,em),[tm(h,em),tm(...addMin(h,m,d+10)),tm(...addMin(h,m,d-10)),tm(...addMin(h,m,d+5))])}

let YPX=20;
function layoutField(){const st=$('#stage');if(!st)return;const w=st.clientWidth;YPX=Math.max(9,Math.min(34,w/34));const wd=$('#world');wd.style.setProperty('--ypx',YPX+'px');wd.style.width=(120*YPX)+'px';const sp=Math.round(Math.min(150,Math.max(60,YPX*4.6),st.clientHeight*.5));wd.style.setProperty('--spr',sp+'px');wd.style.setProperty('--sprb',Math.round(sp*.85)+'px');camera(G.yard,true)}
function camera(yard,instant){const st=$('#stage'),wd=$('#world');const w=st.clientWidth;let x=-( (10+yard)*YPX - w*.36);x=Math.min(0,Math.max(x,-(120*YPX-w)));
  if(instant){wd.style.transition='none';wd.style.transform=`translateX(${x}px)`;void wd.offsetWidth;wd.style.transition=''}else wd.style.transform=`translateX(${x}px)`}
const at=(el,yard)=>{el.style.left=`calc(var(--ypx)*${10+yard})`};
function place(instant){const y=G.yard;const els=['#me','#d0','#d1','#d2','#los','#fdl'].map(s=>$(s));
  if(instant)els.forEach(e=>e.style.transition='none');
  at($('#me'),y-1.6);at($('#d0'),y+2.2);at($('#d1'),y+4.5);at($('#d2'),y+8);at($('#los'),y);
  $('#fdl').hidden=G.fd>=100;at($('#fdl'),Math.min(100,G.fd));
  if(instant){void $('#me').offsetWidth;els.forEach(e=>e.style.transition='')}
  camera(y,instant)}
function updateBoard(){const toGo=G.fd-G.yard;$('#dd').textContent=`${ord(G.down)} & ${G.fd>=100?'Goal':toGo}`;$('#spot').textContent=spotText(G.yard);
  $('#pips').innerHTML=[lvLo(),lvLo()+1,lvLo()+2].map(i=>`<i class="${i<=G.level?'on':''} ${i>=4?'g4':''}"></i>`).join('');$('#lvname').textContent=LEVELS[G.level];
  $('#streak').innerHTML=[0,1,2].map(i=>`<i class="${i<G.streak%3||(G.streak>0&&G.streak%3===0&&G.level===6)?'on':''}"></i>`).join('')}
function flash(text,cls=''){const f=$('#flash');f.className='flash '+cls;f.textContent=text;void f.offsetWidth;f.classList.add('show')}
function rangeTxt(kind){const [a,b]=lvRange(kind,G.level);const lo=kind==='run'?BASE[a]:Math.round(BASE[a]*1.3),hi=kind==='run'?BASE[b]+3:Math.round(BASE[b]*1.3)+4;return`${lo}–${hi} yards`}
function callPhase(msg){G.busy=false;Q=null;$('#me').className='spr idle';
  $('#gp').innerHTML=`<div class="qhead"><span class="eyebrow">${ord(G.down)} down · ${G.fd>=100?'goal to go':`${G.fd-G.yard} to go`}</span>${G.down===4?'<span class="chip" style="background:var(--bad)">4th down: last chance for a first down!</span>':''}</div>
   <div class="msg" style="margin-bottom:10px">${msg}</div>
   <div class="calls"><button class="play run" id="prun"><b>RUN</b><span>Easier question, steady gain</span><em>${rangeTxt('run')}</em></button>
   <button class="play pass" id="ppass"><b>PASS</b><span>Harder question, bigger gain</span><em>${rangeTxt('pass')}</em></button></div>`;
  $('#prun').onclick=()=>callPlay('run');$('#ppass').onclick=()=>callPlay('pass');
}
function callPlay(kind){if(G.busy)return;G.busy=true;sfx.tap();const [a,b]=lvRange(kind,G.level);const d0=R(a,b);const p=pickQuestion(d0);const d=p._lvl||d0;let yards=yardsFor(kind,d);let bonus='';
  if(kind==='pass'&&G.streak>=2&&Math.random()<.2){yards=Math.round(yards*1.6);bonus='Deep ball! '}
  G.cur={kind,d,yards,p};
  mountQ($('#gp'),p,`<div class="qhead"><span class="chip ${kind}">${kind==='run'?'RUN':'PASS'}</span><span class="chip lvl">Level ${d} · ${LEVELS[d]}</span><span class="chip worth">${bonus}Worth +${yards} yards</span>${p._retry?'<span class="chip" style="background:#7a3fd0">Second chance! You missed this one before</span>':''}</div>`,
    `${ord(G.down)} & ${G.fd>=100?'Goal':G.fd-G.yard}. Answer right to gain ${yards} yards.`,resolvePlay);

let SCR=null,SCR_BIG=false;
function initScratch(){if(SCR&&SCR.ro)SCR.ro.disconnect();const c=document.getElementById('scratch');if(!c){SCR=null;return}
  const box=c.closest('.scratch'),gb=document.getElementById('scgrow');
  const setBig=v=>{SCR_BIG=v;box.classList.toggle('big',v);gb.textContent=v?'−':'+';gb.setAttribute('aria-label',v?'Make the scratch pad smaller':'Make the scratch pad bigger')};
  setBig(SCR_BIG);gb.onclick=()=>{sfx.tap();setBig(!SCR_BIG);if(SCR_BIG)setTimeout(()=>c.scrollIntoView({behavior:'smooth',block:'nearest'}),60)};
  const g=c.getContext('2d');const st={color:'#1d2547',erase:false,strokes:[],cur:null,pen:false,dpr:1};SCR=st;
  const seg=(k,a,b)=>{g.globalCompositeOperation=k.erase?'destination-out':'source-over';g.strokeStyle=k.color;g.lineCap='round';g.lineJoin='round';
    g.lineWidth=k.erase?24:1.8+(b[2]??.5)*3.6;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()};
  const redraw=()=>{g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,c.width,c.height);g.setTransform(st.dpr,0,0,st.dpr,0,0);

function toLine(svg){
  svg=svg.replace(/<ellipse cx="60" cy="114"[^>]*\/>/,'').replace(/<path d="M33 26 Q38 15 48 11"[^>]*\/>/,'').replace(/<circle[^>]*data-drop="1"\/>/g,'')
    .replace(/<path d="M60 8 L60 27" stroke="[^"]*" stroke-width="8"\/>/,'<rect x="56" y="8.5" width="8" height="18.5" fill="#fff" stroke="#111" stroke-width="1.4"/>');
  svg=svg.replace(/<(circle|ellipse|rect|path)\b([^>]*?)\/>/g,(m,tag,a)=>{if(a.includes('data-keep'))return`<${tag}${a.replace(/fill="[^"]*"/,'fill="#111"')}/>`;
    a=a.replace(/fill="(?!none)[^"]*"/g,'fill="#fff"').replace(/stroke="[^"]*"/g,'stroke="#111"');if(!/stroke=/.test(a)&&!/fill="none"/.test(a))a+=' stroke="#111" stroke-width="1.3"';return`<${tag}${a}/>`});
  return svg.replace(/<text([^>]*?)fill="[^"]*"([^>]*?)stroke="[^"]*" stroke-width="[^"]*"/g,'<text$1fill="#fff"$2stroke="#111" stroke-width="1.4"');
}

let DL=null;try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{})}catch(e){}
async function saveFile(name,blob,type){if(DL)return DL.save({filename:name,data:blob});
  const f=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e&&e.name==='AbortError')throw{code:'declined'}}}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function renderPNG(svg){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=1700;c.height=2200;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1700,2200);x.drawImage(img,0,0,1700,2200);c.toBlob(b=>b?res(b):rej(new Error('render')),'image/png')};img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}

const PACKS=[{id:'std',name:'Player Pack',cards:3,cost:150,desc:'2 player cards plus 1 promo card: a Legend, an Award winner or a Special appearance.'},{id:'mega',name:'Mega Pack',cards:6,cost:400,desc:'4 player cards, 1 guaranteed Gold or Hall of Fame player, plus 1 promo card.'}];
const DAILY={id:'daily',name:'Pack of the Day',cards:3,promos:2,cost:0};
function checkDaily(){if(S.dailyDay!==today()){S.dailyDay=today();S.dailyReady=true;save()}return S.dailyReady}
function drawPromo(){let x=Math.random()*PROMOS.reduce((a,p)=>a+PW[p.kind],0);for(const p of PROMOS){x-=PW[p.kind];if(x<=0)return p}return PROMOS[0]}
const TW={base:10,silver:6,gold:3,hof:1};
function drawCard(goldPlus){const pool=TEAMS.filter(T=>!goldPlus||T.tier==='gold'||T.tier==='hof').flatMap(T=>[1,2].map(slot=>({T,slot,w:TW[T.tier]})));
  let x=Math.random()*pool.reduce((a,c)=>a+c.w,0);for(const c of pool){x-=c.w;if(x<=0)return c}return pool[pool.length-1]}
function packArt(P){return`<div class="pack ${P.id}"><div class="pk-top">${P.id==='daily'?'PACK OF THE DAY':S.sport==='hockey'?'NUMON HOCKEY':'NUMON GRIDIRON'}</div><div class="pk-ball${S.sport==='hockey'?' puck':''}"></div><b>${P.name}</b><span>${P.cards} cards</span></div>`}
function renderShop(){const HK=S.sport==='hockey';const have=HK?HTEAMS.reduce((a,T)=>a+[1,2].filter(sl=>S.hcards[hk(T,sl)]).length,0):TEAMS.reduce((a,T)=>a+[1,2].filter(sl=>S.cards[ck(T,sl)]).length,0);
  $('#v-shop').innerHTML=`<div class="panel"><div class="head"><button class="btn" id="back4">← Locker room</button><h2>${HK?'Hockey card shop':'Football card shop'}</h2><span class="stat" style="font-size:18px;margin-left:auto">${comma(S.coins)} coins</span></div>

  $('#back4').onclick=()=>{renderHome();show('home')};if($('#openfree'))$('#openfree').onclick=()=>buyPack(PACKS[0],true);if($('#opendaily'))$('#opendaily').onclick=()=>buyPack(DAILY,'daily');

function buyPack(P,free=false){const daily=free==='daily';if(daily?!S.dailyReady:free?S.unopened<1:S.coins<P.cost)return;sfx.tap();if(daily)S.dailyReady=false;else if(free)S.unopened--;else S.coins-=P.cost;S.packs=(S.packs||0)+1;const np=P.promos||1;const HK=S.sport==='hockey',store=HK?S.hcards:S.cards;
  const got=[];for(let i=0;i<P.cards-np;i++){const c=(HK?hDrawCard:drawCard)(P.id==='mega'&&i===P.cards-2);const k=HK?hk(c.T,c.slot):ck(c.T,c.slot);const isNew=!store[k];store[k]=(store[k]||0)+1;got.push({...c,isNew,count:S.cards[k]})}
  for(let i=0;i<np;i++){const x=HK?drawHPromo():drawPromo();const k='X-'+x.key;const isNew=!store[k];store[k]=(store[k]||0)+1;got.push({T:x.T,promo:x.key,isNew,count:S.cards[k]})}
  save();renderBar();
  modal(`<h2>${daily?'Pack of the Day':free?'Free reward pack':P.name}</h2><div id="packzone" style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%"><button class="packbtn" id="rip" aria-label="Open the pack">${packArt(P)}</button><div class="note">Tap the pack to rip it open!</div></div>`,{},true);

     <p class="note">${got.filter(c=>c.isNew).length} new card${got.filter(c=>c.isNew).length===1?'':'s'}! ${S.unopened?`${S.unopened} free pack${S.unopened>1?'s':''} still to open. `:''}${comma(S.coins)} coins left.</p>
     <div class="row">${S.unopened?`<button class="btn go" style="font-size:18px;padding:10px 18px" id="freeagain">Open next free pack</button>`:S.dailyReady?`<button class="btn go" style="font-size:18px;padding:10px 18px" id="dailyagain">Open Pack of the Day</button>`:S.coins>=P.cost&&!free?`<button class="btn go" style="font-size:18px;padding:10px 18px" id="again">Buy another · ${P.cost}</button>`:''}<button class="btn blue" id="tob">See binder</button><button class="btn" id="cls">Done</button></div>`;
    $('#cls').onclick=()=>{closeModal();renderShop()};$('#tob').onclick=()=>{closeModal();renderBinder();show('binder')};if($('#again'))$('#again').onclick=()=>buyPack(P);if($('#freeagain'))$('#freeagain').onclick=()=>buyPack(PACKS[0],true);if($('#dailyagain'))$('#dailyagain').onclick=()=>buyPack(DAILY,'daily')}}
if(!reduce){document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.scard.tilt');if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    c.classList.add('live');c.style.setProperty('--rx',((.5-y)*18).toFixed(2)+'deg');c.style.setProperty('--ry',((x-.5)*22).toFixed(2)+'deg');c.style.setProperty('--mx',(x*100).toFixed(1)+'%');c.style.setProperty('--my',(y*100).toFixed(1)+'%')});
  const off=e=>{const c=e.target.closest&&e.target.closest('.scard.tilt');if(c&&!(e.relatedTarget&&c.contains(e.relatedTarget))){c.classList.remove('live');c.style.removeProperty('--rx');c.style.removeProperty('--ry')}};
  document.addEventListener('pointerout',off);document.addEventListener('pointercancel',off)}

/* ============ PRACTICE + REPORT ============ */
const teamOf=id=>id>100?HTEAMS[id-101]:TEAMS[id-1];
const needPractice=()=>S.missed.filter(m=>!m.mastered);
const fmtDate=t=>new Date(t).toLocaleDateString([],{month:'short',day:'numeric'});
let RV=null,RF='need';
function startReview(){const list=needPractice().slice(0,10);if(!list.length)return;sfx.tap();closeModal();RV={ids:list.map(m=>m.id),i:0,fixed:0};
  $('#v-game').innerHTML=`<div class="panel"><div class="head"><button class="btn" id="rvback">← Report</button><h2>Practice missed questions</h2></div><p class="note" style="margin:6px 0 0">Film study! No game on the line. Get a question right and it moves to your learned list.</p></div><div class="panel" id="gp"></div>`;
  $('#rvback').onclick=()=>{Q=null;RV=null;renderReport();show('report')};show('game');rvNext()}
function rvNext(){const m=S.missed.find(x=>x.id===RV.ids[RV.i]);if(!m){RV.i++;return RV.i<RV.ids.length?rvNext():rvDone()}
  const p={kind:m.kind,text:m.text,vis:m.vis,answer:m.answer,choices:m.kind==='choice'?(m.choices.length===3?m.choices:shuffle(m.choices)):null,unit:m.unit};
  mountQ($('#gp'),p,`<div class="qhead"><span class="eyebrow">Question ${RV.i+1} of ${RV.ids.length}</span><span class="chip lvl">Level ${m.level}</span>${m.tp?`<span class="chip">${m.tp}</span>`:''}</div>`,`Missed on ${fmtDate(m.at)} against the ${teamOf(m.team).name}.`,ok=>{
    const cur=S.missed.find(x=>x.id===m.id)||m;cur.tries=(cur.tries||0)+1;
    if(ok){cur.mastered=true;cur.masteredAt=Date.now();RV.fixed++;S.coins+=5;S.coinsEarned+=5;renderBar();sfx.ok();$('#msg').textContent='Correct! Moved to your learned list. +5 coins.'}else{sfx.bad();$('#msg').textContent='Not quite. It stays on your practice list.'}
    markDay();save();RV.i++;setTimeout(()=>{if(!RV)return;RV.i<RV.ids.length?rvNext():rvDone()},ok?1200:2600)})}
function rvDone(){const r=RV;RV=null;Q=null;if(r.fixed)sfx.win();
  modal(`<div class="eyebrow">Film study done</div><h2>You learned ${r.fixed} of ${r.ids.length}</h2><p class="note">${r.fixed===r.ids.length?'Every one of them!':'The rest stay on your list for next time.'}</p>
   <div class="row">${needPractice().length?'<button class="btn blue" data-act="more">Practice more</button>':''}<button class="btn" data-act="report">See report</button><button class="btn go" style="font-size:20px;padding:12px 22px" data-act="home">Locker room</button></div>`,
   {more:startReview,report:()=>{closeModal();renderReport();show('report')},home:()=>{closeModal();renderHome();show('home')}})}
function meter(label,c,n){const p=n?Math.round(c/n*100):null;return`<div class="meter"><div class="ml"><span>${label}</span><b>${p===null?'—':p+'%'}</b></div><div class="mt" title="${label}: ${c} of ${n} right"><i style="width:${p||0}%"></i></div><small>${n?`${c} of ${n} right`:'Not tried yet'}</small></div>`}
function renderReport(){const st=S.stats,n=st.n.reduce((a,b)=>a+b,0),c=st.c.reduce((a,b)=>a+b,0);
  const need=needPractice(),learned=S.missed.filter(m=>m.mastered),list=RF==='need'?need:RF==='learned'?learned:S.missed,shown=list.slice(0,60);
  const g3n=st.n.slice(1,4).reduce((a,b)=>a+b,0),g3c=st.c.slice(1,4).reduce((a,b)=>a+b,0),g4n=st.n.slice(4,7).reduce((a,b)=>a+b,0),g4c=st.c.slice(4,7).reduce((a,b)=>a+b,0),g5n=st.n.slice(7).reduce((a,b)=>a+b,0),g5c=st.c.slice(7).reduce((a,b)=>a+b,0);
  $('#v-report').innerHTML=`<div class="panel"><div class="head"><button class="btn" id="back3">← Locker room</button><h2>Progress report</h2></div>
    <p class="note" style="margin:6px 0 0" id="synctxt">${syncText()}</p>
    <div class="kpis">
      <div class="kpi"><span>Football cards</span><b>${cardCount()}<small>/${CARD_TOTAL}</small></b><em>${EDITIONS[edOf('football')]} edition · Grade ${gradeOf('football')}</em></div>
      <div class="kpi"><span>Hockey cards</span><b>${typeof hCount==='function'?hCount():0}<small>/${typeof HCARD_TOTAL!=='undefined'?HCARD_TOTAL:105}</small></b><em>${EDITIONS[edOf('hockey')]} edition · Grade ${gradeOf('hockey')}</em></div>
      <div class="kpi"><span>Coins earned</span><b>${comma(S.coinsEarned||0)}</b><em>${comma(S.coins)} to spend</em></div>
      <div class="kpi"><span>Games won</span><b>${S.wins}<small>/${S.played}</small></b></div>
      <div class="kpi"><span>Questions right</span><b>${n?Math.round(c/n*100)+'%':'—'}</b><em>${c} of ${n}</em></div>
      <div class="kpi"><span>Top difficulty</span><b>Lv ${S.bestLevel}</b><em>${LEVELS[S.bestLevel]}</em></div>
      <div class="kpi"><span>Best streak</span><b>${S.bestStreak}</b><em>in a row</em></div>
      <div class="kpi"><span>Days played</span><b>${S.days.length}</b><em>${streak()} day streak</em></div>
    </div></div>
  <div class="panel"><h3 class="rh">Accuracy by difficulty</h3><div class="meters2"><div>${meter('Grade 3 overall',g3c,g3n)}${[1,2,3].map(i=>meter(`Level ${i} · ${LEVELS[i]}`,st.c[i],st.n[i])).join('')}</div><div>${meter('Grade 4 overall',g4c,g4n)}${[4,5,6].map(i=>meter(`Level ${i} · ${LEVELS[i]}`,st.c[i],st.n[i])).join('')}</div><div>${meter('Grade 5 overall',g5c,g5n)}${[7,8,9].map(i=>meter(`Level ${i} · ${LEVELS[i]}`,st.c[i],st.n[i])).join('')}</div></div></div>
  <div class="panel"><div class="head"><h3 class="rh" style="margin:0">Missed questions</h3>
    <div class="seg" role="group" aria-label="Filter missed questions">${[['need',`To practice (${need.length})`],['learned',`Learned (${learned.length})`],['all',`All (${S.missed.length})`]].map(([k,l])=>`<button data-f="${k}" class="${RF===k?'on':''}" aria-pressed="${RF===k}">${l}</button>`).join('')}</div>
    ${need.length?`<button class="btn go" id="practice" style="font-size:18px;padding:10px 18px;margin-left:auto">Practice ${Math.min(10,need.length)} now</button>`:''}</div>
    ${shown.length?`<div class="mlist">${shown.map(m=>`<div class="mi"><div class="mtop"><span class="pill ${m.mastered?'ok':'need'}">${m.mastered?'✓ Learned':'To practice'}</span><span>${fmtDate(m.at)} · vs ${teamOf(m.team).name} · Level ${m.level}${m.tp?' · '+m.tp:''}</span></div>
      <div class="mq">${m.text}</div>${m.vis&&m.vis.length?`<div class="mvis">${renderVis(m.vis)}</div>`:''}
      <div class="mans"><span class="gave">Answered <b>${m.given}</b></span><span class="right">Correct <b>${m.kind==='num'?comma(m.answer)+(m.unit||''):m.answer}</b></span>${m.tries?`<span class="tries">${m.tries} practice tr${m.tries>1?'ies':'y'}</span>`:''}</div></div>`).join('')}</div>${list.length>shown.length?`<p class="note">Showing the newest ${shown.length} of ${list.length}.</p>`:''}`
    :`<p class="note">${RF==='need'?(S.missed.length?'Nothing left to practice. Every missed question has been learned!':'No missed questions yet. Questions to practice from your games will show up here.'):'Nothing here yet.'}</p>`}</div>
  <div class="panel"><h3 class="rh">Recent games</h3>${S.log.length?`<div class="tablewrap"><table class="blog"><thead><tr><th>Date</th><th>Opponent</th><th>Result</th><th class="r">Plays</th><th class="r">Yards or score</th><th class="r">Right</th></tr></thead><tbody>
    ${S.log.slice(0,30).map(l=>{const T=teamOf(l.team);return`<tr><td>${new Date(l.at).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</td><td>${T.city} ${T.name}${l.round!=null?` · ${PLAYOFFS[l.round].r}`:''}${l.sport==='hockey'?' · Hockey':''}</td><td><span class="pill ${l.won?'ok':'lost'}">${l.won?(l.sport==='hockey'?'Won '+l.score:'Won 7–0'):'Good try'}</span></td><td class="r">${l.plays}</td><td class="r">${l.sport==='hockey'?l.score:l.yards}</td><td class="r">${l.right}/${l.plays}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="note">No games yet.</p>'}</div>`;
  $('#back3').onclick=()=>{renderHome();show('home')};if($('#practice'))$('#practice').onclick=startReview;
  document.querySelectorAll('#v-report .seg button').forEach(b=>b.onclick=()=>{RF=b.dataset.f;renderReport()})}
function refreshView(){if(RV)return;if(G){return}const v=VIEWS.find(n=>!$('#v-'+n).hidden)||'home';({home:renderHome,binder:renderBinder,report:renderReport,shop:renderShop}[v]||renderHome)();renderBar()}

/* grown-ups */
function grownups(){const a=R(12,19),b=R(3,9);
  modal(`<h2>Grown-ups only</h2><p class="note">To open settings, solve: <b>${a} × ${b}</b></p><input class="field" id="gate" inputmode="numeric" autocomplete="off"><div class="row"><button class="btn blue" data-act="check">Unlock</button><button class="btn" data-act="close">Cancel</button></div><div id="gmsg" class="note"></div>`,
  {check:()=>{if(+$('#gate').value===a*b)settings();else $('#gmsg').textContent='That answer is not right. Try again.'}})}
function settings(){let armed=false;
  modal(`<h2>Settings</h2><p class="note">${S.wins} games won · ${cardCount()} of ${CARD_TOTAL} cards</p><p class="note" style="font-size:13px" id="synctxt">${syncText()}</p><div id="acctbox" style="width:100%"></div>
  <div class="row"><button class="btn blue" data-act="report">Open progress report</button><button class="btn blue" data-act="daily">Give a new Pack of the Day</button></div>
  <div class="row"><button class="btn blue" data-act="edup">Move ${S.sport==='hockey'?'hockey':'football'} up to the next edition</button></div>
  <div class="row"><button class="btn blue" data-act="backup">Backup progress</button><button class="btn blue" data-act="restore">Restore from backup</button></div><input type="file" id="restorefile" accept="application/json,.json" hidden><div class="row"><button class="btn" data-act="reset" style="color:var(--bad)">Erase all progress</button></div><button class="btn" data-act="close">Close</button>`,
  {report:()=>{closeModal();renderReport();show('report')},daily:()=>{S.dailyDay='';save();closeModal();renderHome();show('home')},edup:()=>{closeModal();if(typeof levelUp==='function')levelUp(spNow())},
   backup:async()=>{const b=new Blob([JSON.stringify({app:'numon-gridiron',v:2,savedAt:new Date().toISOString(),state:S},null,1)],{type:'application/json'});
     try{await saveFile(`gridiron-backup-${today()}.json`,b,'application/json');$('#synctxt').textContent='Backup saved. Keep the file somewhere safe, like Files or iCloud Drive.'}catch(e){$('#synctxt').textContent='Backup not saved.'}},
   restore:()=>{const inp=$('#restorefile');inp.onchange=async()=>{try{const d=JSON.parse(await inp.files[0].text());if(!d||!d.state||!d.state.cards)throw 0;
     S=Object.assign(fresh(),d.state);migrate();save();closeModal();renderHome();show('home');modal('<h2>Progress restored</h2><p class="note">Cards, coins and history are back.</p><button class="btn" data-act="close">OK</button>')}catch(e){$('#synctxt').textContent='That file is not a Gridiron backup.'}};inp.click()},reset:b=>{if(!armed){armed=true;b.textContent='Tap again to erase everything';return}S=fresh();save();closeModal();renderHome();show('home')}});renderAcct()}
$('#grownup').onclick=grownups;
function gearMenu(){const opt=(v,l,d)=>`<button class="stylepick ${S.style===v?'on':''}" data-act="st" data-v="${v}"><div class="art">${(()=>{const k=S.style;S.style=v;const h=fig(ME,true,MEP());S.style=k;return h})()}</div><b>${l}</b><span>${d}</span></button>`;
  const sp=(v,l,d,ic)=>`<button class="stylepick ${S.sport===v?'on':''}" data-act="sp" data-v="${v}"><div class="art" style="display:grid;place-items:center">${ic}</div><b>${l}</b><span>${d}</span></button>`;
  modal(`<h2>Settings</h2><div class="note" style="font-weight:800">Sport</div><div class="row">${sp('football','Football','Drive down the field','<svg viewBox="0 0 40 40" width="70" height="70"><ellipse cx="20" cy="20" rx="17" ry="11" transform="rotate(-35 20 20)" fill="#9a4f1d" stroke="#16203f" stroke-width="2"/><path d="M14 26L26 14M16.5 20.5l3 3M19 18l3 3M21.5 15.5l3 3" stroke="#fff" stroke-width="1.8"/></svg>')}${sp('hockey','Hockey','Score 5 goals on the ice','<svg viewBox="0 0 40 40" width="70" height="70"><path d="M8 6 L22 30 L34 30 L34 34 L19 34 L5 8 Z" fill="#8a5a2b" stroke="#16203f" stroke-width="1.5"/><ellipse cx="27" cy="25" rx="7" ry="3.5" fill="#111"/></svg>')}</div>
   <p class="note">Each sport has its own teams, games and card binder. Coins, math progress and the progress report are shared.</p>
   <div class="note" style="font-weight:800">Player style</div><div class="row">${opt('mini','Mini players','Big helmets, small bodies')}${opt('numon','Numons','Creatures in jerseys')}</div>
   <p class="note">Your choice changes the players everywhere: on the field, on the home screen, on every card and on coloring pages.</p><div class="row"><button class="btn" data-act="close">Done</button></div>`,
   {st:b=>{S.style=b.dataset.v;save();closeModal();refreshView();gearMenu()},sp:b=>{if(G){closeModal();return}S.sport=b.dataset.v;save();closeModal();renderHome();show('home');gearMenu()}},true)}
$('#gear').onclick=gearMenu;
$('#coinbtn').onclick=()=>{if(G||RV)return;renderShop();show('shop')};
$('#mute').onclick=()=>{S.muted=!S.muted;save();renderBar();sfx.tap()};
renderHome();show('home');renderSync();connectCloud();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
